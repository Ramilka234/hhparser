[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hhru-parser"
version = "0.1.0"
description = "Async HH.ru vacancy parser"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]